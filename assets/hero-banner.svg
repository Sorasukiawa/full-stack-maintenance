<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d11"/>
      <stop offset="52%" stop-color="#131520"/>
      <stop offset="100%" stop-color="#181c2e"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="18%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#0a84ff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTeal" cx="88%" cy="12%" r="50%">
      <stop offset="0%" stop-color="#30d158" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#40c8e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ringClean" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#30d158"/>
      <stop offset="100%" stop-color="#40c8e0"/>
    </linearGradient>
    <linearGradient id="tileBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#47a3ff"/>
      <stop offset="100%" stop-color="#0a6cf0"/>
    </linearGradient>
    <linearGradient id="tilePurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cb84ff"/>
      <stop offset="100%" stop-color="#9a46f0"/>
    </linearGradient>
    <linearGradient id="tileIndigo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8582ff"/>
      <stop offset="100%" stop-color="#4d4ad6"/>
    </linearGradient>
    <linearGradient id="tileGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#50d86c"/>
      <stop offset="100%" stop-color="#24b046"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="capShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ambient Apple Dark Background -->
  <rect width="1200" height="320" rx="26" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="26" fill="url(#glowBlue)"/>
  <rect width="1200" height="320" rx="26" fill="url(#glowTeal)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="25.25" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Left Content: Title, Subtitle & macOS Icon Pills -->
  <g transform="translate(52, 48)">
    <rect x="0" y="0" width="248" height="28" rx="14" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.10"/>
    <circle cx="15" cy="14" r="4.5" fill="#30d158"/>
    <text x="28" y="18.5" fill="#64d2ff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.6">MULTI-AGENT ORCHESTRATOR SKILL</text>

    <text x="0" y="78" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif" font-size="43" font-weight="800" letter-spacing="-1">full-stack-maintenance</text>

    <text x="0" y="113" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif" font-size="15.5" font-weight="500">
      4-Domain Read-Only Audit · Snapshot Diff · Apple-Style Waterline Dashboard · Safe Pre-Flight Guard
    </text>
    <text x="0" y="140" fill="#e5e5ea" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif" font-size="15" font-weight="600">
      跨 Mac 本机、本地多仓库、GitHub 远端与 NAS/PVE 的四域联动巡检与交互式空间水位看板
    </text>

    <!-- System Settings Style Domain Pills -->
    <g transform="translate(0, 170)" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600" fill="#f5f5f7">
      <g transform="translate(0, 0)">
        <rect width="154" height="36" rx="11" fill="#222226" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.07"/>
        <rect x="7" y="6" width="24" height="24" rx="6.5" fill="url(#tileBlue)"/>
        <rect x="12" y="11" width="14" height="9" rx="1.4" fill="none" stroke="#fff" stroke-width="1.7"/>
        <line x1="10" y1="22.5" x2="28" y2="22.5" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/>
        <text x="39" y="22.5">Mac &amp; Backups</text>
      </g>

      <g transform="translate(164, 0)">
        <rect width="166" height="36" rx="11" fill="#222226" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.07"/>
        <rect x="7" y="6" width="24" height="24" rx="6.5" fill="url(#tilePurple)"/>
        <path d="M12 13.5a1.5 1.5 0 0 1 1.5-1.5h3l1.5 1.6h5.5a1.5 1.5 0 0 1 1.5 1.5v6.4a1.5 1.5 0 0 1-1.5 1.5h-10a1.5 1.5 0 0 1-1.5-1.5z" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"/>
        <text x="39" y="22.5">Multi-Repo &amp; Git</text>
      </g>

      <g transform="translate(340, 0)">
        <rect width="156" height="36" rx="11" fill="#222226" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.07"/>
        <rect x="7" y="6" width="24" height="24" rx="6.5" fill="url(#tileIndigo)"/>
        <circle cx="15.5" cy="13.5" r="1.8" fill="none" stroke="#fff" stroke-width="1.6"/>
        <circle cx="15.5" cy="22.5" r="1.8" fill="none" stroke="#fff" stroke-width="1.6"/>
        <circle cx="22.5" cy="14.5" r="1.8" fill="none" stroke="#fff" stroke-width="1.6"/>
        <path d="M15.5 15.3v5.4M22.5 16.3c0 3-3.2 2.8-6.2 5" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
        <text x="39" y="22.5">GitHub Hygiene</text>
      </g>

      <g transform="translate(506, 0)">
        <rect width="170" height="36" rx="11" fill="#222226" fill-opacity="0.88" stroke="#ffffff" stroke-opacity="0.07"/>
        <rect x="7" y="6" width="24" height="24" rx="6.5" fill="url(#tileGreen)"/>
        <rect x="12" y="11" width="14" height="5" rx="1.3" fill="none" stroke="#fff" stroke-width="1.6"/>
        <rect x="12" y="19" width="14" height="5" rx="1.3" fill="none" stroke="#fff" stroke-width="1.6"/>
        <circle cx="15" cy="13.5" r="0.9" fill="#fff"/>
        <circle cx="15" cy="21.5" r="0.9" fill="#fff"/>
        <text x="39" y="22.5">NAS &amp; Proxmox VE</text>
      </g>
    </g>
  </g>

  <!-- Right Graphic: Apple-Style Activity Ring & Pill Bar Hero Card -->
  <g transform="translate(768, 34)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="384" height="252" rx="24" fill="#222226" fill-opacity="0.92" stroke="#ffffff" stroke-opacity="0.07"/>

    <!-- Activity-style Round-Capped Storage Ring (Center: 94, 114, r=58) -->
    <g transform="translate(94, 114)">
      <!-- Track -->
      <circle cx="0" cy="0" r="58" fill="none" stroke="#787880" stroke-opacity="0.22" stroke-width="14"/>
      <!-- Retained Used Arc (~75% = 270 deg, from -90 deg clockwise to +180 deg) -->
      <path d="M 0 -58 A 58 58 0 1 1 -58 0" fill="none" stroke="#636366" stroke-width="14" stroke-linecap="round"/>
      <!-- Reclaimable Arc (from +180 deg to +232 deg) with round caps & soft shadow -->
      <path d="M -58 0 A 58 58 0 0 1 -35.7 -45.7" fill="none" stroke="url(#ringClean)" stroke-width="14" stroke-linecap="round" filter="url(#capShadow)"/>

      <!-- Ring Center Readout -->
      <text x="0" y="-15" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">预计可释放</text>
      <text x="0" y="9" fill="#30d158" font-family="ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="-0.6">73.0 <tspan font-size="11" font-weight="700" fill="#a1a1a6">GiB</tspan></text>
      <text x="0" y="25" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="500" text-anchor="middle">86.7% → 78.8%</text>
    </g>

    <!-- Right Column inside Card -->
    <g transform="translate(182, 26)">
      <text x="0" y="16" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif" font-size="16" font-weight="800" letter-spacing="-0.3">Mac 本机磁盘</text>
      <rect x="104" y="3" width="60" height="18" rx="9" fill="#ff9f0a" fill-opacity="0.16"/>
      <text x="134" y="15" fill="#ff9f0a" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">接近警戒线</text>
      <text x="0" y="33" fill="#6e6e73" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="9.5">/System/Volumes/Data · 80%</text>

      <!-- 2x2 Mini Stat Grid -->
      <g transform="translate(0, 44)">
        <rect x="0" y="0" width="180" height="78" rx="10" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.06"/>
        <line x1="90" y1="0" x2="90" y2="78" stroke="#ffffff" stroke-opacity="0.06"/>
        <line x1="0" y1="39" x2="180" y2="39" stroke="#ffffff" stroke-opacity="0.06"/>

        <circle cx="11" cy="13" r="3" fill="#636366"/>
        <text x="18" y="16" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9">清理后已用</text>
        <text x="9" y="31" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700">730.0 GiB</text>

        <circle cx="101" cy="13" r="3" fill="#30d158"/>
        <text x="108" y="16" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9">将释放</text>
        <text x="99" y="31" fill="#30d158" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700">73.00 GiB</text>

        <circle cx="11" cy="52" r="3" fill="#3a3a3c"/>
        <text x="18" y="55" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9">清理后可用</text>
        <text x="9" y="70" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700">196.0 GiB</text>

        <circle cx="101" cy="52" r="3" fill="#636366"/>
        <text x="108" y="55" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9">总容量</text>
        <text x="99" y="70" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="700">926.0 GiB</text>
      </g>

      <!-- Pill-shaped Space Composition Bar -->
      <g transform="translate(0, 134)">
        <text x="0" y="10" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif" font-size="9.5" font-weight="700">空间构成</text>
        <text x="180" y="10" fill="#a1a1a6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" text-anchor="end">803.0 GiB</text>
        <rect x="0" y="16" width="180" height="9" rx="4.5" fill="#787880" fill-opacity="0.22"/>
        <rect x="0" y="16" width="52" height="9" rx="4.5" fill="#0a84ff"/>
        <rect x="55" y="16" width="38" height="9" rx="4.5" fill="#bf5af2"/>
        <rect x="96" y="16" width="24" height="9" rx="4.5" fill="#ff9f0a"/>
        <rect x="123" y="16" width="14" height="9" rx="4.5" fill="#40c8e0"/>
        <rect x="140" y="16" width="18" height="9" rx="4.5" fill="#636366"/>
      </g>
    </g>

    <!-- Bottom Guard Pill -->
    <rect x="20" y="206" width="344" height="28" rx="14" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.06"/>
    <text x="192" y="224" fill="#a1a1a6" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="10.5" font-weight="600" text-anchor="middle">🛡️ preflight: lsof · mtime &lt; 60m · worktree · whitelist OK</text>
  </g>
</svg>
