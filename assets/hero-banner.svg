<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="barGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="320" rx="24" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#334155" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.55">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="300" y1="0" x2="300" y2="320"/>
    <line x1="600" y1="0" x2="600" y2="320"/>
    <line x1="900" y1="0" x2="900" y2="320"/>
  </g>

  <!-- Decorative Glow Orbs -->
  <circle cx="1020" cy="80" r="110" fill="#38bdf8" opacity="0.10" filter="url(#glow)"/>
  <circle cx="920" cy="240" r="130" fill="#10b981" opacity="0.08" filter="url(#glow)"/>

  <!-- Left Content: Title & Tagline -->
  <g transform="translate(56, 54)">
    <rect x="0" y="0" width="236" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.45"/>
    <circle cx="16" cy="14" r="4.5" fill="#34d399"/>
    <text x="28" y="18.5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">MULTI-AGENT ORCHESTRATOR SKILL</text>

    <text x="0" y="78" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="42" font-weight="800" letter-spacing="-0.8">full-stack-maintenance</text>

    <text x="0" y="114" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="16.5" font-weight="400">
      Cross-Domain Read-Only Audit · Snapshot Diff · Interactive Waterline Dashboard · Safe Concurrency Guard
    </text>
    <text x="0" y="140" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans', sans-serif" font-size="15" font-weight="500">
      跨 Mac 本机、本地多仓库、GitHub 远端与 NAS/PVE 的四域联动巡检与可视化水位模拟看板技能
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 168)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="12.5" font-weight="600">
      <rect x="0" y="0" width="148" height="32" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="74" y="20.5" fill="#38bdf8" text-anchor="middle">💻 Mac &amp; Backups</text>

      <rect x="160" y="0" width="166" height="32" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="243" y="20.5" fill="#818cf8" text-anchor="middle">📂 Multi-Repo &amp; Git</text>

      <rect x="338" y="0" width="154" height="32" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="415" y="20.5" fill="#c084fc" text-anchor="middle">🐙 GitHub Hygiene</text>

      <rect x="504" y="0" width="174" height="32" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="591" y="20.5" fill="#34d399" text-anchor="middle">🏠 NAS &amp; Proxmox VE</text>
    </g>
  </g>

  <!-- Right Graphic: Mini Live Waterline Card -->
  <g transform="translate(800, 44)">
    <rect x="0" y="0" width="344" height="232" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700">📊 Waterline Simulator Preview</text>
    <text x="324" y="32" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="700" text-anchor="end">-114.0 GiB</text>

    <!-- Gauge 1 -->
    <g transform="translate(20, 50)">
      <text x="0" y="12" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600">Mac Data Volume</text>
      <text x="304" y="12" fill="#34d399" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" text-anchor="end">97% → 71%</text>
      <rect x="0" y="20" width="304" height="8" rx="4" fill="#1e293b"/>
      <rect x="0" y="20" width="215" height="8" rx="4" fill="url(#barGreen)"/>
      <line x1="243" y1="17" x2="243" y2="31" stroke="#ef4444" stroke-width="2"/>
    </g>

    <!-- Gauge 2 -->
    <g transform="translate(20, 96)">
      <text x="0" y="12" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600">PVE local-lvm Thin Pool</text>
      <text x="304" y="12" fill="#34d399" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" text-anchor="end">84% → 59%</text>
      <rect x="0" y="20" width="304" height="8" rx="4" fill="#1e293b"/>
      <rect x="0" y="20" width="179" height="8" rx="4" fill="url(#barGreen)"/>
      <line x1="243" y1="17" x2="243" y2="31" stroke="#ef4444" stroke-width="2"/>
    </g>

    <!-- Gauge 3 -->
    <g transform="translate(20, 142)">
      <text x="0" y="12" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="600">Cloud Encrypted Backup</text>
      <text x="304" y="12" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" text-anchor="end">63G → 15G</text>
      <rect x="0" y="20" width="304" height="8" rx="4" fill="#1e293b"/>
      <rect x="0" y="20" width="95" height="8" rx="4" fill="url(#accentGrad)"/>
      <line x1="243" y1="17" x2="243" y2="31" stroke="#ef4444" stroke-width="2"/>
    </g>

    <!-- Bottom Guard Pill -->
    <rect x="20" y="186" width="304" height="28" rx="7" fill="#1e293b"/>
    <text x="172" y="204" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" text-anchor="middle">🛡️ preflight: lsof + mtime + whitelist OK</text>
  </g>
</svg>
